[package]
name = "flight-academy-api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Lib + bin in one crate per ADR-005 §D; binary name follows ADR-002 §C/§E.
# `build.rs` at the package root is auto-detected by Cargo; it compiles
# Tailwind v4 CSS for the MASH HTML surface (ADR-020 §O) via Bun +
# @tailwindcss/cli, emitting `static/app.css` for the `/static/*` ServeDir.
[lib]

[[bin]]
name = "flight-academy"
path = "src/main.rs"

# embedded-static gates rust-embed + a static-asset handler for self-host
# (ADR-002 §H, ADR-005 §D, ADR-020 §O). The feature swaps the `ServeDir`
# static service for an in-memory `rust-embed`-backed handler so the
# self-host artefact (`flight-academy-embedded`) ships as a single binary —
# Maud templates already compile into the binary directly; this feature
# wraps the *static* assets (vendored HTMX + Alpine, compiled Tailwind CSS;
# IBM Plex woff2 lands in the typography slice).
[features]
embedded-static = ["dep:rust-embed"]

[dependencies]
axum = { workspace = true, features = ["macros"] }
clap = { workspace = true, features = ["derive", "env"] }
derive_more = { workspace = true, features = ["from"] }
flight-academy-auth = { workspace = true }
flight-academy-core = { workspace = true }
flight-academy-db = { workspace = true }
maud = { workspace = true, features = ["axum"] }
# rust-embed bakes `apps/api/static/` into the binary under
# `--features embedded-static` per ADR-020 §O (self-host single-binary
# distribution variant). `debug-embed` forces compile-time embedding under
# `cargo test` and debug builds — without it rust-embed would re-read the
# source directory at runtime, which defeats the point of the test variant
# (we want the test to exercise the same code path that ships). `mime-guess`
# enables `Metadata::mimetype()` so the embedded handler emits the right
# `Content-Type` without us hand-maintaining an extension → MIME map.
rust-embed = { workspace = true, optional = true, features = ["debug-embed", "mime-guess"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["macros"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "time"] }
tower = { workspace = true }
tower-http = { workspace = true, features = ["fs", "request-id", "set-header", "timeout", "trace"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
utoipa = { workspace = true, features = ["axum_extras", "uuid"] }
utoipa-axum = { workspace = true }
uuid = { workspace = true, features = ["serde", "v7"] }

[dev-dependencies]
flight-academy-test-support = { workspace = true }
futures-util = { workspace = true }
http-body-util = { workspace = true }
tower = { workspace = true, features = ["util"] }

[build-dependencies]
# Content-hash served assets so URLs like `/static/app-<hash>.css` can carry
# `Cache-Control: max-age=31536000, immutable` per ADR-020 §I. The hash is
# computed from the file body at build time and the hashed path is emitted
# into `OUT_DIR/asset_manifest.rs` for the runtime to `include!()`. SHA-256
# is overkill for URL fingerprinting (a uniform-random 32-bit prefix is
# enough to avoid collisions across the ~10 vendored assets) but it is a
# workspace-known dependency we already pull in via the audit-chain code,
# so reusing it keeps the build-deps minimal.
sha2 = { workspace = true }
# Precompress every text asset (CSS + JS) at build time per the
# `Accept-Encoding`-based negotiation served from both the default
# `ServeDir` (via `tower-http`'s `.precompressed_br()` /
# `.precompressed_gzip()`) and the `embedded-static` handler. Brotli at
# quality 11 + gzip at quality 9 (both maxed) — we compress once and
# ship forever, so the per-build CPU cost amortises across every cached
# response. Woff2 files are NOT precompressed: their container is
# already brotli'd, double-compression inflates.
brotli = { workspace = true }
flate2 = { workspace = true }
# zstd precompression sits at the top of the negotiation priority
# (`zstd > br > gz > identity`). Chrome 123+ / Firefox 126+ advertise it
# in `Accept-Encoding`; for clients that don't, the embedded handler
# and `ServeDir`'s `.precompressed_*()` chain fall through to brotli
# and then gzip automatically. Quality 22 is `Zstd::Best` — slowest at
# build but smallest on the wire, same once-and-ship-forever trade-off
# as brotli q11 above.
zstd = { workspace = true }
