[workspace]
resolver = "3"
members = [
    "crates/flight-academy-core",
    "crates/flight-academy-db",
    "crates/flight-academy-auth",
    "crates/flight-academy-store",
    "crates/flight-academy-test-support",
    "apps/api",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/flight-academy-uk/flight-academy"
publish = false

[workspace.dependencies]
# Every external dependency's version and default features are declared
# once here. Members write `name = { workspace = true }` and
# add only the features specific to that crate.

# Internal crates
flight-academy-auth = { version = "0.1.0", path = "crates/flight-academy-auth" }
flight-academy-core = { version = "0.1.0", path = "crates/flight-academy-core" }
flight-academy-db = { version = "0.1.0", path = "crates/flight-academy-db" }
flight-academy-store = { version = "0.1.0", path = "crates/flight-academy-store" }
flight-academy-test-support = { version = "0.1.0", path = "crates/flight-academy-test-support" }

# External crates
aead = "0.5.2"
aes-gcm = "0.10.3"
aes-gcm-siv = "0.11.1"
axum = "0.8.9"
brotli = "8.0.3"
chacha20poly1305 = "0.10.1"
clap = "4.6.1"
derive_more = "2.1.1"
flate2 = "1.1.5"
futures-util = "0.3.31"
http-body-util = "0.1.3"
maud = "0.27.0"
rand_core = "0.6.4"
rust-embed = "8.11.0"
serde = "1.0.228"
serde_jcs = "0.2.0"
serde_json = "1.0.150"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid"] }
subtle = "2.6.1"
testcontainers-modules = "0.15.0"
time = "0.3.47"
tokio = "1.52.3"
tower = "0.5.3"
tower-http = "0.7.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
utoipa = "6.0.0"
utoipa-axum = "0.3.0"
uuid = "1.23.2"
zeroize = "1.8.1"
zstd = "0.13.3"
